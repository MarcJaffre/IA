############################################################################################################################
# Présentation:                                                                                                            #
# - Paramètres pour la compilation (début de fichier)                                                                      #
# - Paramètres pour l'environnement à son lancement                                                                        #
############################################################################################################################



############################################################################################################################
# Configuration #
#################
GITHUB_LLAMA='https://github.com/ggerganov/llama.cpp.git'

############################################################################################################################
# Dossier de SORTIE #
#####################
# confliter avec le cmake install
PARM_01="-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$WORKDIR/output/llama.cpp"

############################################################################################################################
# Activation CUDA et optimisation pour RTX 3060 (Ampere = 86) #
###############################################################
PARM_02='-DCMAKE_BUILD_TYPE=Release'
PARM_03='-DGGML_CUDA=ON'
PARM_04='-DCMAKE_CUDA_ARCHITECTURES=86'
PARM_05='-DGGML_CUDA_FA_ALL_QUANTS=ON'

############################################################################################################################
# Fonctionnalités et réduction du temps de compilation #
########################################################
PARM_06='-DLLAMA_OPENSSL=ON'
PARM_07='-DLLAMA_BUILD_TESTS=OFF'
PARM_08='-DBUILD_SHARED_LIBS=OFF'

############################################################################################################################
# CCACHE #
##########
PARM_09='-DGGML_CCACHE=OFF'

# Permet d'utiliser le cache lors d'une recompilation (gain de performance)
# Affiche : ccache -s;
# Purge   : ccache -c
# Taille  : ccache -M 1G

############################################################################################################################
# Globale #
###########
CMAKE_ARGS="$PARM_02 $PARM_03 $PARM_04 $PARM_05 $PARM_06 $PARM_07 $PARM_08 $PARM_09"
LLAMA_SERVICE_OPTION="--host $LLAMA_HOST --port $LLAMA_PORT --api-key $LLAMA_API"

############################################################################################################################
# Définir l'emplacement des modèles #
#####################################
MODEL_DIR="$WORKDIR/output/llama.cpp/bin/models"
mkdir -p "$MODEL_DIR";
export LLAMA_CACHE="$MODEL_DIR"

############################################################################################################################
# Définir les modèles à télécharger pour llama #
################################################
# Modele qui se télécharge lors du lancement ponctuel.

MODELE_1="Qwen/Qwen3-VL-8B-Instruct-GGUF:Q4_K_M"
MODELE_2=""
MODELE_3=""
MODELE_4=""
MODELE_5=""
MODELE_6=""
LISTES_MODELES="$MODELE_1 $MODELE_2 $MODELE_3 $MODELE_4 $MODELE_5 $MODELE_6"


############################################################################################################################
# Définir les paramètres du service SYSTEMD #
#############################################
LLAMA_HOST="0.0.0.0"
LLAMA_PORT="8080"
LLAMA_API="admin"
