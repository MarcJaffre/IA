############################################################################################################################
# Configuration #
#################
GITHUB_LLAMA='https://github.com/ggerganov/llama.cpp.git'

############################################################################################################################
# Configuration du service SYSTEMD #
####################################
LLAMA_HOST="0.0.0.0"
LLAMA_PORT="8080"
LLAMA_API="admin"

OLLAMA_SERVICE_OPTION="--host $LLAMA_HOST --port $LLAMA_PORT --api-key $LLAMA_API"


############################################################################################################################
# Activation CUDA et optimisation pour RTX 3060 (Ampere = 86) #
###############################################################
PARM_01='-DCMAKE_BUILD_TYPE=Release'
PARM_02='-DGGML_CUDA=ON'
PARM_03='-DCMAKE_CUDA_ARCHITECTURES=86'
PARM_04='-DGGML_CUDA_FA_ALL_QUANTS=ON'

############################################################################################################################
# Fonctionnalités et réduction du temps de compilation #
########################################################
PARM_05='-DLLAMA_OPENSSL=ON'
PARM_06='-DLLAMA_BUILD_TESTS=OFF'

############################################################################################################################
# Globale #
###########
CMAKE_ARGS="$PARM_01% $PARM_02 $PARM_03 $PARM_04 $PARM_05 $PARM_06"

